<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAPZIS | Live Price List</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#071a3d,#0b2d66);

min-height:100vh;

padding:30px;

overflow-x:hidden;

position:relative;

}

body::before{

content:"CAPZIS";

position:fixed;

font-size:180px;

font-weight:bold;

color:white;

opacity:.05;

top:50%;

left:50%;

transform:translate(-50%,-50%) rotate(-25deg);

pointer-events:none;

}

.container{

max-width:1100px;

margin:auto;

background:rgba(255,255,255,.12);

backdrop-filter:blur(18px);

border-radius:20px;

padding:35px;

box-shadow:0 15px 40px rgba(0,0,0,.35);

}

h1{

color:white;

text-align:center;

font-size:38px;

margin-bottom:10px;

}

.sub{

text-align:center;

color:#d5d5d5;

margin-bottom:25px;

}

.badge{

display:inline-block;

background:#00c853;

padding:8px 18px;

border-radius:50px;

color:white;

font-weight:bold;

margin-bottom:20px;

}

.search{

width:100%;

padding:14px;

font-size:16px;

border-radius:10px;

border:none;

margin-bottom:25px;

}

table{

width:100%;

border-collapse:collapse;

background:white;

border-radius:15px;

overflow:hidden;

}

th{

background:#0d47a1;

color:white;

padding:16px;

}

td{

padding:15px;

text-align:center;

border-bottom:1px solid #eee;

}

tr:hover{

background:#eef5ff;

transition:.3s;

}

footer{

text-align:center;

color:white;

margin-top:25px;

font-size:14px;

}

@media(max-width:700px){

h1{

font-size:28px;

}

table{

font-size:14px;

}

}

</style>

</head>

<body>

<div class="container">

<h1>CAPZIS</h1>

<div class="sub">

Electronic Components Live Price List

</div>

<center>

<div class="badge">

Last Updated : 17 Aug 2026

</div>

</center>

<input class="search" id="search" placeholder="Search Product...">

<table id="tbl">

<tr>

<th>ID</th>

<th>Product</th>

<th>Price</th>

<th>Updated</th>

</tr>

<tr>

<td>P001</td>

<td>Capacitor 50MFD</td>

<td>₹100</td>

<td>17-08-2026</td>

</tr>

</table>

<footer>

© 2026 CAPZIS • Live Price List

</footer>

</div>

<script>

document.getElementById("search").addEventListener("keyup",function(){

let value=this.value.toLowerCase();

let rows=document.querySelectorAll("#tbl tr");

rows.forEach((r,i)=>{

if(i==0)return;

r.style.display=r.innerText.toLowerCase().includes(value)?"":"none";

});

});

</script>

</body>

</html>
